# Committed evaluation config, embedded in the binary.
# The API key never lives in a config file: it is read only from AI_API_KEY.

[providers.deepseek]
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
temperature = 0.0

[providers.qwen]
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
model = "qwen3.8-flash"
temperature = 0.0
seed = 42

[agent]
instructions = """
Resolve the user's task completely: understand the relevant code, make focused changes, \
and verify them. Be concise and precise."""
# Offers the root thread the create_sub_agent tool (up to five run in parallel).
subagents = true

[skills]
paths = [".banana-harness/skills", "~/.config/banana-harness/skills"]
