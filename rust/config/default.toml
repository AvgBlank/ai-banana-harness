# Committed evaluation config, embedded in the binary.
# The API key never lives in a config file: it is read only from AI_API_KEY.

# A provider may also set `context_length` and `max_output` (tokens); compaction then fires at
# the smaller of 80% of the context and the context minus max_output, instead of at 50,000.

[providers.deepseek]
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
temperature = 0.0

[providers.qwen]
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
model = "qwen3.8-flash"
temperature = 0.0
seed = 42

[agent]
instructions = """
Resolve the user's task completely: understand the relevant code, make focused changes, \
and verify them. Be concise and precise."""
# Subagents (ticket 07) are not implemented yet; the config flag exists so the system
# prompt's <sub-agents> section can be exercised ahead of it.
subagents = false

[skills]
paths = [".banana-harness/skills", "~/.config/banana-harness/skills"]

[tools]
bash_timeout_secs = 120 # at most 600
output_max_bytes = 30720

# Each key is "allow", "ask" or "deny", or a table of pattern = action where `*` matches
# anything and the LAST matching pattern wins (patterns stay in the order written). Overlays
# that repeat a pattern change it in place; new patterns are appended, so they win.
# "ask" currently behaves as "deny". Read/edit patterns match workspace-relative paths.
[permission]
edit = "allow"
glob = "allow"
grep = "allow"
external_directory = "deny"

[permission.read]
"*" = "allow"
".env*" = "deny"
"*/.env*" = "deny"

[permission.bash]
"*" = "allow"
"sudo *" = "deny"
"su *" = "deny"
"rm -rf /*" = "deny"
"rm -rf ~*" = "deny"
"git push*" = "deny"
"curl * | sh*" = "deny"
"curl * | bash*" = "deny"
"wget * | sh*" = "deny"
"wget * | bash*" = "deny"
"mkfs*" = "deny"
"dd *" = "deny"
"shutdown*" = "deny"
"reboot*" = "deny"
"chmod -R 777 /*" = "deny"

# MCP servers. `preload = true` registers a server's tools directly; any other server sits
# behind the list_tools/get_tool_info/call_tool meta-tools and is started only when a call
# targets it. `{env:VAR}` in `env` values is expanded when the server starts.
# [mcp.fs]
# type = "local"
# command = ["npx", "-y", "@modelcontextprotocol/server-filesystem", "."]
# env = {}
# preload = false
# description = "Filesystem access"
#
# MCP tools are matched by tool name; the last matching pattern wins.
# [permission.mcp]
# "delete_*" = "deny"
