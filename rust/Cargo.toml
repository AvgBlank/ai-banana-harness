[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
publish = false

# Every third-party version is pinned here; members inherit with `workspace = true`.
[workspace.dependencies]
harness-llm = { path = "crates/harness-llm" }
harness-tools = { path = "crates/harness-tools" }
harness-mcp = { path = "crates/harness-mcp" }
harness-store = { path = "crates/harness-store" }
harness-core = { path = "crates/harness-core" }
harness-tui = { path = "crates/harness-tui" }

# Async and HTTP. TLS uses rustls with the `ring` provider (no aws-lc build).
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "process", "fs", "io-util", "io-std", "signal", "time", "sync"] }
tokio-util = "0.7.19"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "charset", "system-proxy", "json", "stream"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
sse-stream = "0.2.6"

# MCP: rmcp moves fast, so it is pinned exactly.
rmcp = { version = "=3.4.1", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider", "auth"] }

# TUI
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui-textarea = "0.9.2"
tui-markdown = "0.3.10"
syntect = "5.3.0"
two-face = "0.5.2"
similar = "3.2.0"

# Storage and config
rusqlite = { version = "0.40.2", features = ["bundled"] }
toml = "1.1.6"
etcetera = "0.11.0"

# Search
ignore = "0.4.33"
globset = "0.4.20"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"

# Utilities
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
thiserror = "2.0.21"
ulid = "3.0.0"
clap = { version = "4.6.7", features = ["derive", "env"] }

# Tests
tempfile = "3.27.0"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
