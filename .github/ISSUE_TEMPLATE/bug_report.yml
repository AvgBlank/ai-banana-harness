name: Bug report
description: Something isn't working as expected
labels: ['bug', 'needs-maintainer-attention']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please do not report security vulnerabilities here — see [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. `make setup && make run` with provider ...
        2. Paste ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running Banana Harness?
      options:
        - TUI (make run)
        - Headless run (banana-harness run)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: the commit SHA you built
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Headless JSON-lines output, error messages, or screenshots. Redact secrets.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:
        Terminal:
        Provider (DeepSeek or Qwen):
